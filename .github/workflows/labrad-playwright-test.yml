name: LaBlood Hokkaido Place Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Find Hokkaido donation places
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:

              browser = p.chromium.launch()

              page = browser.new_page()

              # =========================================
              # ① ReservationHome
              # =========================================

              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              # =========================================
              # ② 北海道
              # =========================================

              links = page.locator("a")

              hokkaido_link = None

              for i in range(links.count()):

                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except Exception:
                      text = ""

                  if text == "北海道":

                      hokkaido_link = link

                      print(
                          "北海道リンク発見:",
                          i
                      )

                      break

              if hokkaido_link is None:
                  raise Exception(
                      "北海道リンクが見つかりません"
                  )

              hokkaido_link.click()

              page.wait_for_timeout(3000)

              # =========================================
              # ③ 献血の予約
              # =========================================

              reservation_link = page.locator(
                  "a"
              ).filter(
                  has_text="献血の予約"
              ).first

              reservation_link.click()

              page.wait_for_timeout(3000)

              # =========================================
              # ④ 献血予約の開始
              # =========================================

              start_link = page.locator(
                  "a"
              ).filter(
                  has_text="献血予約の開始"
              ).first

              start_link.click()

              page.wait_for_timeout(3000)

              # =========================================
              # ⑤ 性別：男性
              # =========================================

              page.locator(
                  "#selectedmale"
              ).click()

              page.wait_for_timeout(500)

              # =========================================
              # ⑥ 生年月日
              # =========================================

              selects = page.locator(
                  "select"
              )

              selects.nth(0).select_option(
                  "1990"
              )

              selects.nth(1).select_option(
                  "1"
              )

              selects.nth(2).select_option(
                  "1"
              )

              page.wait_for_timeout(500)

              # =========================================
              # ⑦ 次へ
              # =========================================

              page.locator(
                  "#Blooddonationageform\\:j_id41\\:nextButton"
              ).click(
                  force=True
              )

              page.wait_for_timeout(5000)

              print("")
              print(
                  "=== RESERVATION SEARCH PAGE ==="
              )

              print(
                  "URL:",
                  page.url
              )

              print(
                  "TITLE:",
                  page.title()
              )

              # =========================================
              # ⑧ 現在のリンクを調査
              # =========================================

              print("")
              print(
                  "=== ALL LINKS ==="
              )

              links = page.locator("a")

              for i in range(
                  links.count()
              ):

                  link = links.nth(i)

                  try:
                      text = (
                          link.inner_text()
                          .strip()
                      )
                  except Exception:
                      text = ""

                  href = link.get_attribute(
                      "href"
                  )

                  if text:

                      print(
                          "LINK",
                          i,
                          "TEXT:",
                          text,
                          "HREF:",
                          href
                      )

              # =========================================
              # ⑨ 北海道関連リンクを調査
              # =========================================

              print("")
              print(
                  "=== HOKKAIDO RELATED ==="
              )

              for i in range(
                  links.count()
              ):

                  link = links.nth(i)

                  try:
                      text = (
                          link.inner_text()
                          .strip()
                      )
                  except Exception:
                      text = ""

                  if "北海道" in text:

                      print(
                          "HOKKAIDO",
                          i,
                          "TEXT:",
                          text,
                          "HREF:",
                          link.get_attribute(
                              "href"
                          ),
                          "HTML:",
                          link.evaluate(
                              "(el) => el.outerHTML"
                          )
                      )

              # =========================================
              # ⑩ ページ本文
              # =========================================

              print("")
              print(
                  "=== PAGE TEXT ==="
              )

              print(
                  page.locator(
                      "body"
                  ).inner_text()[:30000]
              )

              browser.close()

          PY
