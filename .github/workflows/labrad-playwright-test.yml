name: LaBlood Reservation Detail Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run LaBlood test
        run: |
          cat > test_labrad.py <<'PY'
          from playwright.sync_api import sync_playwright

          BASE_URL = "https://www.kenketsu.jp/ReservationHome"

          with sync_playwright() as p:

              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={"width": 1280, "height": 2000},
                  locale="ja-JP"
              )

              print("=== 1. ReservationHome ===")

              page.goto(
                  BASE_URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              print("URL:", page.url)
              print("TITLE:", page.title())

              print()
              print("=== 2. 北海道を選択 ===")

              hokkaido = page.locator("a").filter(
                  has_text="北海道"
              ).first

              print("北海道リンク数:", page.locator("a").filter(
                  has_text="北海道"
              ).count())

              hokkaido.click()

              page.wait_for_timeout(3000)

              print("URL:", page.url)
              print("TITLE:", page.title())

              print()
              print("=== 3. 「献血の予約」を選択 ===")

              reserve = page.locator("a").filter(
                  has_text="献血の予約"
              ).first

              print("献血の予約リンク数:", page.locator("a").filter(
                  has_text="献血の予約"
              ).count())

              reserve.click()

              page.wait_for_timeout(3000)

              print("URL:", page.url)
              print("TITLE:", page.title())

              print()
              print("=== 4. 「献血予約の開始」を選択 ===")

              start = page.locator("a").filter(
                  has_text="献血予約の開始"
              ).first

              print("献血予約の開始リンク数:", page.locator("a").filter(
                  has_text="献血予約の開始"
              ).count())

              start.click()

              page.wait_for_timeout(3000)

              print("URL:", page.url)
              print("TITLE:", page.title())

              print()
              print("=== 5. 年齢確認 ===")

              # テスト用の性別
              page.locator("#selectedmale").click()

              # テスト用生年月日
              # 実際のユーザー情報ではありません。
              page.locator("select").nth(0).select_option("1990")
              page.locator("select").nth(1).select_option("1")
              page.locator("select").nth(2).select_option("1")

              page.wait_for_timeout(500)

              next_button = page.locator(
                  "#Blooddonationageform\\:j_id41\\:nextButton"
              )

              print("次へボタン数:", next_button.count())

              next_button.click(force=True)

              page.wait_for_timeout(4000)

              print("URL:", page.url)
              print("TITLE:", page.title())

              print()
              print("=== 6. 北海道の施設一覧 ===")

              print(
                  page.locator("body").inner_text()
              )

              print()
              print("=== 7. 予約するリンク ===")

              reserve_links = page.locator("a").filter(
                  has_text="予約する"
              )

              count = reserve_links.count()

              print("予約するリンク数:", count)

              if count == 0:
                  print("ERROR: 予約するリンクが見つかりません")
                  browser.close()
                  raise SystemExit(1)

              for i in range(count):
                  link = reserve_links.nth(i)

                  print()
                  print("--------------------------------")
                  print("予約する #", i)
                  print("--------------------------------")

                  print("TEXT:", link.inner_text())

                  try:
                      print("HTML:")
                      print(link.evaluate(
                          "(el) => el.outerHTML"
                      ))
                  except Exception as e:
                      print("HTML取得失敗:", e)

              print()
              print("=== 8. 最初の施設を選択 ===")

              # 最初の施設
              # 北海道赤十字血液センター
              first_reserve = reserve_links.nth(0)

              print("選択する施設:")
              print(
                  first_reserve.locator(
                      "xpath=ancestor::li[contains(@class,'mod-list-room__list')]"
                  ).inner_text()
              )

              first_reserve.click()

              page.wait_for_timeout(5000)

              print()
              print("=== 9. 予約詳細画面 ===")

              print("URL:", page.url)
              print("TITLE:", page.title())

              print()
              print("=== 10. PAGE TEXT ===")

              print(
                  page.locator("body").inner_text()
              )

              print()
              print("=== 11. ALL LINKS ===")

              links = page.locator("a")

              print("リンク総数:", links.count())

              for i in range(links.count()):
                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except:
                      text = ""

                  if text:
                      try:
                          href = link.get_attribute("href")
                      except:
                          href = None

                      print(
                          f"LINK {i}: TEXT={text} HREF={href}"
                      )

              print()
              print("=== 12. SELECT ===")

              selects = page.locator("select")

              print("select総数:", selects.count())

              for i in range(selects.count()):

                  sel = selects.nth(i)

                  print()
                  print("--------------------------------")
                  print("SELECT", i)
                  print("--------------------------------")

                  try:
                      print("NAME:", sel.get_attribute("name"))
                      print("ID:", sel.get_attribute("id"))
                      print("VALUE:", sel.input_value())

                      print(
                          sel.evaluate(
                              "(el) => el.outerHTML"
                          )
                      )

                  except Exception as e:
                      print("取得失敗:", e)

              print()
              print("=== 13. INPUT / BUTTON ===")

              elements = page.locator(
                  "input, button"
              )

              print(
                  "input/button総数:",
                  elements.count()
              )

              for i in range(elements.count()):

                  el = elements.nth(i)

                  try:
                      print(
                          "ELEMENT",
                          i,
                          "TAG=",
                          el.evaluate("(e) => e.tagName"),
                          "TEXT=",
                          el.inner_text(),
                          "NAME=",
                          el.get_attribute("name"),
                          "ID=",
                          el.get_attribute("id"),
                          "VALUE=",
                          el.get_attribute("value")
                      )

                  except Exception as e:
                      print(
                          "ELEMENT",
                          i,
                          "取得失敗:",
                          e
                      )

              print()
              print("=== 14. 「血漿成分献血」 ===")

              plasma = page.locator(
                  "text=血漿成分献血"
              )

              print(
                  "血漿成分献血要素数:",
                  plasma.count()
              )

              for i in range(plasma.count()):

                  el = plasma.nth(i)

                  try:
                      print()
                      print(
                          "PLASMA",
                          i
                      )

                      print(
                          el.evaluate(
                              "(e) => e.outerHTML"
                          )
                      )

                  except Exception as e:
                      print(
                          "取得失敗:",
                          e
                      )

              print()
              print("=== 15. FINISHED ===")

              browser.close()
          PY

          python test_labrad.py
