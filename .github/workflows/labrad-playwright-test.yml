name: LaBlood Hokkaido Navigation Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open LaBlood and select Hokkaido
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()

              # ラブラッド予約ページを開く
              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              print("=== BEFORE ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # 「北海道」を含むリンクを確認
              print("=== HOKKAIDO LINKS ===")

              links = page.locator("a")
              hokkaido_links = []

              for i in range(links.count()):
                  link = links.nth(i)
                  text = link.inner_text().strip()
                  href = link.get_attribute("href")

                  if "北海道" in text:
                      hokkaido_links.append(link)
                      print(
                          "LINK",
                          i,
                          "TEXT:",
                          text,
                          "HREF:",
                          href
                      )

              print(
                  "北海道を含むリンク数:",
                  len(hokkaido_links)
              )

              if len(hokkaido_links) == 0:
                  raise Exception(
                      "北海道を含むリンクが見つかりませんでした"
                  )

              # 北海道リンクをクリック
              print("=== CLICK HOKKAIDO ===")

              hokkaido_links[0].click()

              # 画面遷移・JavaScript処理を待つ
              page.wait_for_timeout(3000)

              print("=== AFTER HOKKAIDO ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # 現在の画面にあるリンクを確認
              print("=== RESERVATION LINKS ===")

              links = page.locator("a")

              for i in range(links.count()):
                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except:
                      text = ""

                  href = link.get_attribute("href")

                  if text:
                      print(
                          "LINK",
                          i,
                          "TEXT:",
                          text,
                          "HREF:",
                          href
                      )

              # 現在の画面全体のテキスト
              print("=== PAGE TEXT ===")
              print(
                  page.locator("body").inner_text()[:15000]
              )

              browser.close()
          PY
