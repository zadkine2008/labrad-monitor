name: LaBlood Age Form Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect age form
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:

              browser = p.chromium.launch()

              page = browser.new_page()

              # =========================================
              # ReservationHome
              # =========================================

              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              # =========================================
              # 北海道
              # =========================================

              links = page.locator("a")

              hokkaido_link = None

              for i in range(links.count()):

                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except Exception:
                      text = ""

                  if text == "北海道":
                      hokkaido_link = link
                      break

              if hokkaido_link is None:
                  raise Exception(
                      "北海道リンクが見つかりません"
                  )

              hokkaido_link.click()

              page.wait_for_timeout(3000)

              # =========================================
              # 献血の予約
              # =========================================

              reservation_link = page.locator(
                  "a"
              ).filter(
                  has_text="献血の予約"
              ).first

              reservation_link.click()

              page.wait_for_timeout(3000)

              # =========================================
              # 献血予約の開始
              # =========================================

              start_link = page.locator(
                  "a"
              ).filter(
                  has_text="献血予約の開始"
              ).first

              start_link.click()

              page.wait_for_timeout(3000)

              print("================================")
              print("AGE FORM INSPECTION")
              print("================================")

              print("URL:", page.url)
              print("TITLE:", page.title())

              # =========================================
              # ① 性別関連HTML
              # =========================================

              print("")
              print("=== GENDER RELATED ELEMENTS ===")

              gender_candidates = page.locator(
                  "input, label"
              )

              for i in range(
                  gender_candidates.count()
              ):

                  el = gender_candidates.nth(i)

                  try:
                      text = el.inner_text().strip()
                  except Exception:
                      text = ""

                  html = el.evaluate(
                      "(el) => el.outerHTML"
                  )

                  if (
                      "男性" in text
                      or "女性" in text
                      or "男性" in html
                      or "女性" in html
                  ):

                      print(
                          "ELEMENT",
                          i
                      )

                      print(
                          html
                      )

              # =========================================
              # ② select構造
              # =========================================

              print("")
              print("=== SELECT ELEMENTS ===")

              selects = page.locator(
                  "select"
              )

              print(
                  "select数:",
                  selects.count()
              )

              for i in range(
                  selects.count()
              ):

                  select = selects.nth(i)

                  print("")
                  print(
                      "SELECT",
                      i
                  )

                  print(
                      "NAME:",
                      select.get_attribute(
                          "name"
                      )
                  )

                  print(
                      "HTML:",
                      select.evaluate(
                          "(el) => el.outerHTML"
                      )
                  )

              # =========================================
              # ③ 「次へ」
              # =========================================

              print("")
              print("=== NEXT ELEMENTS ===")

              all_elements = page.locator(
                  "input, button, a"
              )

              for i in range(
                  all_elements.count()
              ):

                  el = all_elements.nth(i)

                  try:
                      text = el.inner_text().strip()
                  except Exception:
                      text = ""

                  value = el.get_attribute(
                      "value"
                  )

                  if (
                      "次へ" in text
                      or value == "次へ"
                  ):

                      print(
                          "NEXT ELEMENT",
                          i
                      )

                      print(
                          el.evaluate(
                              "(el) => el.outerHTML"
                          )
                      )

              # =========================================
              # ④ 年月日の周辺HTML
              # =========================================

              print("")
              print("=== FORM HTML ===")

              form = page.locator(
                  "form"
              ).first

              print(
                  form.evaluate(
                      "(el) => el.outerHTML"
                  )[:30000]
              )

              browser.close()

          PY
