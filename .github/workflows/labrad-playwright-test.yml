name: LaBlood Non Member Reservation Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open non-member reservation
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:

              browser = p.chromium.launch()

              page = browser.new_page()

              # ==========================================
              # 1. ラブラッド予約ページ
              # ==========================================

              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              print("=== RESERVATION HOME ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # ==========================================
              # 2. 北海道リンク
              # ==========================================

              links = page.locator("a")

              hokkaido_link = None

              for i in range(links.count()):

                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except Exception:
                      text = ""

                  if text == "北海道":

                      hokkaido_link = link

                      print(
                          "北海道リンク発見:",
                          i
                      )

                      break

              if hokkaido_link is None:
                  raise Exception(
                      "北海道リンクが見つかりません"
                  )

              # ==========================================
              # 3. 北海道をクリック
              # ==========================================

              print("=== CLICK HOKKAIDO ===")

              hokkaido_link.click()

              page.wait_for_timeout(3000)

              print("URL:", page.url)
              print("TITLE:", page.title())

              # ==========================================
              # 4. 「献血の予約」リンクを探す
              # ==========================================

              print(
                  "=== NON MEMBER RESERVATION ==="
              )

              reservation_link = page.locator(
                  "a"
              ).filter(
                  has_text="献血の予約"
              )

              print(
                  "献血の予約リンク数:",
                  reservation_link.count()
              )

              if reservation_link.count() == 0:
                  raise Exception(
                      "「献血の予約」リンクが見つかりません"
                  )

              # 最初の「献血の予約」を使用
              reservation_link = reservation_link.first

              print(
                  "LINK HTML:",
                  reservation_link.evaluate(
                      "(el) => el.outerHTML"
                  )
              )

              # ==========================================
              # 5. 非会員予約をクリック
              # ==========================================

              print(
                  "=== CLICK RESERVATION ==="
              )

              reservation_link.click()

              # JSFによる画面遷移を待つ
              page.wait_for_timeout(5000)

              print(
                  "=== AFTER RESERVATION CLICK ==="
              )

              print(
                  "URL:",
                  page.url
              )

              print(
                  "TITLE:",
                  page.title()
              )

              # ==========================================
              # 6. 現在の画面を確認
              # ==========================================

              print(
                  "=== PAGE TEXT ==="
              )

              print(
                  page.locator(
                      "body"
                  ).inner_text()[:20000]
              )

              # ==========================================
              # 7. URLが変化した場合の確認
              # ==========================================

              print(
                  "=== CURRENT URL ==="
              )

              print(page.url)

              browser.close()

          PY
