name: LaBlood Age Check Test 2

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test age confirmation
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:

              browser = p.chromium.launch()

              page = browser.new_page()

              # =========================================
              # ① ReservationHome
              # =========================================

              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              # =========================================
              # ② 北海道
              # =========================================

              links = page.locator("a")

              hokkaido_link = None

              for i in range(links.count()):

                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except Exception:
                      text = ""

                  if text == "北海道":

                      hokkaido_link = link

                      print(
                          "北海道リンク発見:",
                          i
                      )

                      break

              if hokkaido_link is None:
                  raise Exception(
                      "北海道リンクが見つかりません"
                  )

              hokkaido_link.click()

              page.wait_for_timeout(3000)

              # =========================================
              # ③ 献血の予約
              # =========================================

              reservation_link = page.locator(
                  "a"
              ).filter(
                  has_text="献血の予約"
              ).first

              reservation_link.click()

              page.wait_for_timeout(3000)

              # =========================================
              # ④ 献血予約の開始
              # =========================================

              start_link = page.locator(
                  "a"
              ).filter(
                  has_text="献血予約の開始"
              ).first

              start_link.click()

              page.wait_for_timeout(3000)

              print("")
              print("=== AGE CHECK PAGE ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # =========================================
              # ⑤ 男性を選択
              # =========================================

              print("")
              print("=== SELECT MALE ===")

              male_label = page.locator(
                  "#selectedmale"
              )

              print(
                  "男性ラベル数:",
                  male_label.count()
              )

              if male_label.count() == 0:
                  raise Exception(
                      "男性ラベルが見つかりません"
                  )

              print(
                  "男性ラベルHTML:",
                  male_label.evaluate(
                      "(el) => el.outerHTML"
                  )
              )

              male_label.click()

              page.wait_for_timeout(1000)

              print(
                  "男性を選択しました"
              )

              # hidden項目を確認
              selected_male = page.locator(
                  "#Blooddonationageform\\:j_id41\\:selectedMale"
              )

              print(
                  "selectedMale value:",
                  selected_male.input_value()
              )

              # =========================================
              # ⑥ 生年月日を設定
              # =========================================

              print("")
              print("=== SELECT BIRTH DATE ===")

              selects = page.locator(
                  "select"
              )

              print(
                  "select数:",
                  selects.count()
              )

              if selects.count() != 3:
                  raise Exception(
                      "生年月日のselectが3つではありません"
                  )

              # 年
              year_select = selects.nth(0)

              # 月
              month_select = selects.nth(1)

              # 日
              day_select = selects.nth(2)

              year_select.select_option(
                  "1990"
              )

              month_select.select_option(
                  "1"
              )

              day_select.select_option(
                  "1"
              )

              page.wait_for_timeout(1000)

              print(
                  "生年月日:",
                  year_select.input_value(),
                  "/",
                  month_select.input_value(),
                  "/",
                  day_select.input_value()
              )

              # =========================================
              # ⑦ 「次へ」の状態を確認
              # =========================================

              print("")
              print("=== NEXT BUTTON ===")

              next_button = page.locator(
                  "#Blooddonationageform\\:j_id41\\:nextButton"
              )

              print(
                  "次へボタン数:",
                  next_button.count()
              )

              if next_button.count() == 0:
                  raise Exception(
                      "次へボタンが見つかりません"
                  )

              print(
                  "次へHTML:",
                  next_button.evaluate(
                      "(el) => el.outerHTML"
                  )
              )

              # =========================================
              # ⑧ 次へをクリック
              # =========================================

              print("")
              print("=== CLICK NEXT ===")

              next_button.click(
                  force=True
              )

              page.wait_for_timeout(5000)

              # =========================================
              # ⑨ 結果
              # =========================================

              print("")
              print(
                  "=== AFTER NEXT CLICK ==="
              )

              print(
                  "URL:",
                  page.url
              )

              print(
                  "TITLE:",
                  page.title()
              )

              print("")
              print("=== PAGE TEXT ===")

              print(
                  page.locator(
                      "body"
                  ).inner_text()[:30000]
              )

              print("")
              print("=== CURRENT URL ===")

              print(page.url)

              browser.close()

          PY
