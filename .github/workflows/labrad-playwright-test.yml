name: LaBlood Login Structure Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect login page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()

              page = browser.new_page()

              # ==========================================
              # 1. ラブラッド予約ページを開く
              # ==========================================

              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              print("=== RESERVATION HOME ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # ==========================================
              # 2. 北海道リンクを探す
              # ==========================================

              print("=== HOKKAIDO LINK ===")

              links = page.locator("a")

              hokkaido_link = None

              for i in range(links.count()):

                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except Exception:
                      text = ""

                  if text == "北海道":

                      hokkaido_link = link

                      print("北海道リンク発見")
                      print("LINK NUMBER:", i)
                      print("TEXT:", text)
                      print(
                          "HREF:",
                          link.get_attribute("href")
                      )

                      break

              if hokkaido_link is None:
                  raise Exception(
                      "北海道リンクが見つかりませんでした"
                  )

              # ==========================================
              # 3. 北海道をクリック
              # ==========================================

              print("=== CLICK HOKKAIDO ===")

              hokkaido_link.click()

              # JavaScriptによる画面遷移を待つ
              page.wait_for_timeout(3000)

              print("=== AFTER HOKKAIDO ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # ==========================================
              # 4. 「会員登録せずに献血する」を探す
              # ==========================================

              print(
                  "=== NON-MEMBER RESERVATION ==="
              )

              target = page.get_by_text(
                  "会員登録せずに献血する",
                  exact=True
              )

              print(
                  "完全一致件数:",
                  target.count()
              )

              if target.count() == 0:
                  raise Exception(
                      "「会員登録せずに献血する」が見つかりません"
                  )

              # 最初の要素を対象にする
              target = target.first

              print("TAG:", target.evaluate(
                  "(el) => el.tagName"
              ))

              print("VISIBLE:", target.is_visible())

              print("HTML:", target.evaluate(
                  "(el) => el.outerHTML"
              ))

              # ==========================================
              # 5. 親要素を調査
              # ==========================================

              print("=== PARENT ELEMENTS ===")

              for level in range(1, 5):

                  try:

                      info = target.evaluate(
                          """
                          (el, level) => {

                              let e = el;

                              for (
                                  let i = 0;
                                  i < level;
                                  i++
                              ) {

                                  if (e.parentElement) {
                                      e = e.parentElement;
                                  }

                              }

                              return {

                                  tag: e.tagName,

                                  id: e.id,

                                  className:
                                      typeof e.className === "string"
                                      ? e.className
                                      : "",

                                  html:
                                      e.outerHTML.substring(
                                          0,
                                          3000
                                      )
                              };
                          }
                          """,
                          level
                      )

                      print(
                          "=== LEVEL",
                          level,
                          "==="
                      )

                      print(
                          "TAG:",
                          info["tag"]
                      )

                      print(
                          "ID:",
                          info["id"]
                      )

                      print(
                          "CLASS:",
                          info["className"]
                      )

                      print(
                          "HTML:",
                          info["html"]
                      )

                  except Exception as e:

                      print(
                          "PARENT ERROR:",
                          e
                      )

              # ==========================================
              # 6. 現在のページにあるリンクを確認
              # ==========================================

              print("=== LINKS ===")

              all_links = page.locator("a")

              for i in range(all_links.count()):

                  link = all_links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except Exception:
                      text = ""

                  href = link.get_attribute("href")

                  if text:

                      print(
                          "LINK",
                          i,
                          "TEXT:",
                          text,
                          "HREF:",
                          href
                      )

              # ==========================================
              # 7. ボタンを確認
              # ==========================================

              print("=== BUTTONS ===")

              buttons = page.locator("button")

              print(
                  "BUTTON COUNT:",
                  buttons.count()
              )

              for i in range(buttons.count()):

                  button = buttons.nth(i)

                  try:
                      text = button.inner_text().strip()
                  except Exception:
                      text = ""

                  if text:

                      print(
                          "BUTTON",
                          i,
                          "TEXT:",
                          text
                      )

                      try:

                          print(
                              "HTML:",
                              button.evaluate(
                                  "(el) => el.outerHTML"
                              )
                          )

                      except Exception:
                          pass

              # ==========================================
              # 8. ページ全体のテキスト
              # ==========================================

              print("=== PAGE TEXT ===")

              print(
                  page.locator(
                      "body"
                  ).inner_text()[:15000]
              )

              browser.close()
          PY
