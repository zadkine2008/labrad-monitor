name: LaBlood Reservation Start Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open reservation start
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:

              browser = p.chromium.launch()

              page = browser.new_page()

              # ① ラブラッド予約トップ
              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              print("=== RESERVATION HOME ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # ② 北海道をクリック
              links = page.locator("a")

              hokkaido_link = None

              for i in range(links.count()):

                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except Exception:
                      text = ""

                  if text == "北海道":
                      hokkaido_link = link
                      print(
                          "北海道リンク発見:",
                          i
                      )
                      break

              if hokkaido_link is None:
                  raise Exception(
                      "北海道リンクが見つかりません"
                  )

              print("=== CLICK HOKKAIDO ===")

              hokkaido_link.click()

              page.wait_for_timeout(3000)

              print("URL:", page.url)
              print("TITLE:", page.title())

              # ③ 「献血の予約」をクリック
              reservation_link = page.locator(
                  "a"
              ).filter(
                  has_text="献血の予約"
              ).first

              print(
                  "献血の予約リンク数:",
                  page.locator("a").filter(
                      has_text="献血の予約"
                  ).count()
              )

              print(
                  "=== CLICK 献血の予約 ==="
              )

              reservation_link.click()

              page.wait_for_timeout(3000)

              print("URL:", page.url)
              print("TITLE:", page.title())

              # ④ 「献血予約の開始」を探す
              print(
                  "=== FIND 献血予約の開始 ==="
              )

              start_links = page.locator(
                  "a"
              ).filter(
                  has_text="献血予約の開始"
              )

              print(
                  "献血予約の開始リンク数:",
                  start_links.count()
              )

              if start_links.count() == 0:

                  print(
                      "=== ALL LINKS ==="
                  )

                  all_links = page.locator("a")

                  for i in range(
                      all_links.count()
                  ):

                      link = all_links.nth(i)

                      try:
                          text = (
                              link.inner_text()
                              .strip()
                          )
                      except Exception:
                          text = ""

                      if text:
                          print(
                              "LINK",
                              i,
                              "TEXT:",
                              text,
                              "HREF:",
                              link.get_attribute(
                                  "href"
                              )
                          )

                  raise Exception(
                      "「献血予約の開始」が見つかりません"
                  )

              start_link = start_links.first

              print(
                  "START LINK HTML:",
                  start_link.evaluate(
                      "(el) => el.outerHTML"
                  )
              )

              # ⑤ 献血予約の開始をクリック
              print(
                  "=== CLICK 献血予約の開始 ==="
              )

              start_link.click()

              page.wait_for_timeout(5000)

              # ⑥ クリック後の状態を確認
              print(
                  "=== AFTER RESERVATION START CLICK ==="
              )

              print(
                  "URL:",
                  page.url
              )

              print(
                  "TITLE:",
                  page.title()
              )

              print(
                  "=== PAGE TEXT ==="
              )

              print(
                  page.locator(
                      "body"
                  ).inner_text()[:30000]
              )

              print(
                  "=== CURRENT URL ==="
              )

              print(page.url)

              browser.close()

          PY
