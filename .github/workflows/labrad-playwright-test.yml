name: LaBlood Login Navigation Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect non-member reservation button
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()

              # 予約ページ
              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              print("=== RESERVATION HOME ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # 北海道リンクを探す
              links = page.locator("a")

              hokkaido_link = None

              for i in range(links.count()):
                  link = links.nth(i)

                  try:
                      text = link.inner_text().strip()
                  except:
                      text = ""

                  if text == "北海道":
                      hokkaido_link = link
                      print("北海道リンク発見")
                      print("HREF:", link.get_attribute("href"))
                      break

              if hokkaido_link is None:
                  raise Exception("北海道リンクが見つかりません")

              # 北海道をクリック
              hokkaido_link.click()

              page.wait_for_timeout(3000)

              print("=== AFTER HOKKAIDO ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # 「会員登録せずに献血する」を探す
              print("=== NON-MEMBER RESERVATION ===")

              targets = page.get_by_text(
                  "会員登録せずに献血する",
                  exact=True
              )

              print("完全一致件数:", targets.count())

              for i in range(targets.count()):
                  target = targets.nth(i)

                  print("---- TARGET", i, "----")

                  try:
                      print("TAG:", target.evaluate(
                          "(el) => el.tagName"
                      ))
                  except Exception as e:
                      print("TAG ERROR:", e)

                  try:
                      print("HTML:", target.evaluate(
                          "(el) => el.outerHTML"
                      ))
                  except Exception as e:
                      print("HTML ERROR:", e)

                  try:
                      print("VISIBLE:", target.is_visible())
                  except Exception as e:
                      print("VISIBLE ERROR:", e)

                  try:
                      print("ENABLED:", target.is_enabled())
                  except Exception as e:
                      print("ENABLED ERROR:", e)

              # ボタンも確認
              print("=== BUTTONS ===")

              buttons = page.locator("button")

              print("BUTTON COUNT:", buttons.count())

              for i in range(buttons.count()):
                  button = buttons.nth(i)

                  try:
                      text = button.inner_text().strip()
                  except:
                      text = ""

                  if text:
                      print(
                          "BUTTON",
                          i,
                          "TEXT:",
                          text
                      )

                      try:
                          print(
                              "HTML:",
                              button.evaluate(
                                  "(el) => el.outerHTML"
                              )
                          )
                      except:
                          pass

              browser.close()
          PY
