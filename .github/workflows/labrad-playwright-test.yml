from playwright.sync_api import sync_playwright
import re

URL = "https://www.kenketsu.jp/ReservationHome"

with sync_playwright() as p:
    browser = p.chromium.launch(headless=True)
    page = browser.new_page()

    # =========================================================
    # 1. ラブラッド予約トップ
    # =========================================================
    print("=== 1. ReservationHome ===")

    page.goto(URL, wait_until="domcontentloaded")
    page.wait_for_timeout(2000)

    print("URL:", page.url)
    print("TITLE:", page.title())

    # =========================================================
    # 2. 「北海道」をクリック
    # =========================================================
    print("\n=== 2. 北海道をクリック ===")

    # 北海道のリンクを直接指定
    hokkaido_link = page.locator(
        "#ReservationHome\\:j_id63\\:j_id104\\:0\\:j_id106"
    )

    print("北海道リンク数:", hokkaido_link.count())

    hokkaido_link.click()

    # Ajaxによる画面遷移を待つ
    page.wait_for_timeout(2000)

    print("URL:", page.url)
    print("TITLE:", page.title())

    # =========================================================
    # 3. 「献血の予約」をクリック
    # =========================================================
    print("\n=== 3. 献血の予約 ===")

    reservation_link = page.get_by_text("献血の予約", exact=True)

    print("献血の予約リンク数:", reservation_link.count())

    reservation_link.first.click()

    page.wait_for_timeout(2000)

    print("URL:", page.url)
    print("TITLE:", page.title())

    # =========================================================
    # 4. 「献血予約の開始」をクリック
    # =========================================================
    print("\n=== 4. 献血予約の開始 ===")

    start_link = page.get_by_text("献血予約の開始", exact=True)

    print("献血予約の開始リンク数:", start_link.count())

    start_link.first.click()

    page.wait_for_timeout(2000)

    print("URL:", page.url)
    print("TITLE:", page.title())

    # =========================================================
    # 5. 年齢確認画面
    # =========================================================
    print("\n=== 5. 年齢確認 ===")

    # 男性を選択
    male = page.locator("#selectedmale")

    print("男性ボタン数:", male.count())

    male.click()

    # 生年月日
    selects = page.locator("select")

    print("select数:", selects.count())

    # 年
    selects.nth(0).select_option(label="1990")

    # 月
    selects.nth(1).select_option(label="1")

    # 日
    selects.nth(2).select_option(label="1")

    print("生年月日: 1990年1月1日")
    print("性別: 男性")

    # =========================================================
    # 6. 「次へ」
    # =========================================================
    print("\n=== 6. 年齢確認「次へ」 ===")

    next_button = page.locator(
        "#Blooddonationageform\\:j_id41\\:nextButton"
    )

    print("次へボタン数:", next_button.count())

    # JavaScript/Ajaxボタンなので force=True
    next_button.click(force=True)

    page.wait_for_timeout(3000)

    print("URL:", page.url)
    print("TITLE:", page.title())

    # =========================================================
    # 7. 年齢確認後の画面
    # =========================================================
    print("\n=== 7. 年齢確認後 ===")

    print("URL:", page.url)
    print("TITLE:", page.title())

    # =========================================================
    # 8. 北海道をクリック
    # =========================================================
    print("\n=== 8. 北海道をクリック ===")

    hokkaido_after = page.locator(
        "#ReservationHome\\:j_id63\\:j_id104\\:0\\:j_id106"
    )

    print("北海道リンク数:", hokkaido_after.count())

    if hokkaido_after.count() == 0:
        print("❌ 北海道リンクが見つかりません")

        print("\n=== 現在のリンク一覧 ===")

        links = page.locator("a")

        for i in range(links.count()):
            try:
                text = links.nth(i).inner_text().strip()
                href = links.nth(i).get_attribute("href")

                if text:
                    print(
                        f"LINK {i}: TEXT={text} HREF={href}"
                    )
            except Exception:
                pass

    else:
        hokkaido_after.click()

        # Ajaxによる更新を待つ
        page.wait_for_timeout(3000)

        print("北海道クリック後")
        print("URL:", page.url)
        print("TITLE:", page.title())

    # =========================================================
    # 9. 北海道クリック後の全リンクを確認
    # =========================================================
    print("\n=== 9. ALL LINKS AFTER HOKKAIDO ===")

    links = page.locator("a")

    print("リンク総数:", links.count())

    for i in range(links.count()):
        try:
            text = links.nth(i).inner_text().strip()
            href = links.nth(i).get_attribute("href")

            if text:
                print(
                    f"LINK {i} TEXT: {text} HREF: {href}"
                )

        except Exception:
            pass

    # =========================================================
    # 10. 北海道関連の施設名を抽出
    # =========================================================
    print("\n=== 10. HOKKAIDO / FACILITY RELATED ===")

    body_text = page.locator("body").inner_text()

    keywords = [
        "北海道",
        "献血ルーム",
        "血液センター",
        "大通",
        "アスティ",
        "新さっぽろ",
        "北彩都",
        "帯広",
    ]

    for keyword in keywords:
        if keyword in body_text:
            print(f"FOUND: {keyword}")

    # =========================================================
    # 11. ページ全文
    # =========================================================
    print("\n=== 11. PAGE TEXT AFTER HOKKAIDO ===")

    print(body_text)

    # =========================================================
    # 12. スクリーンショット
    # =========================================================
    page.screenshot(
        path="lalblood_hokkaido_test.png",
        full_page=True
    )

    print("\n=== TEST FINISHED ===")
    print("スクリーンショット: lalblood_hokkaido_test.png")

    browser.close()
