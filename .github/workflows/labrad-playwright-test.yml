name: LaBlood Hokkaido Navigation Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Select Hokkaido
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()

              page.goto(
                  "https://www.kenketsu.jp/ReservationHome",
                  wait_until="networkidle",
                  timeout=60000
              )

              print("=== BEFORE ===")
              print("URL:", page.url)
              print("TITLE:", page.title())

              # 都道府県選択のプルダウンを探す
              selects = page.locator("select")

              print("SELECT COUNT:", selects.count())

              for i in range(selects.count()):
                  print(
                      "SELECT",
                      i,
                      "NAME:",
                      selects.nth(i).get_attribute("name"),
                      "ID:",
                      selects.nth(i).get_attribute("id")
                  )

              # 「北海道」が入っているselectを探す
              target_select = None

              for i in range(selects.count()):
                  options = selects.nth(i).locator("option")
                  option_texts = options.all_inner_texts()

                  if "北海道" in option_texts:
                      target_select = selects.nth(i)
                      print("Hokkaido select found:", i)
                      print("Options:", option_texts)
                      break

              if target_select is None:
                  raise Exception("北海道を含むselectが見つかりませんでした")

              # 北海道を選択
              page.locator("a").filter(has_text="北海道").first.click()

              print("=== HOKKAIDO SELECTED ===")

              # 画面の更新を待つ
              page.wait_for_timeout(3000)

              print("URL:", page.url)
              print("TITLE:", page.title())
print("=== RESERVATION LINKS ===")

for i, link in enumerate(page.locator("a").all()):
    text = link.inner_text().strip()
    href = link.get_attribute("href")

    if text:
        print("LINK", i, "TEXT:", text, "HREF:", href)
              print("=== PAGE TEXT ===")
              print(page.locator("body").inner_text()[:15000])

              browser.close()
          PY
