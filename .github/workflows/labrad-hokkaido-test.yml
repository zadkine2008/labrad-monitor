name: LaBlood Hokkaido Connection Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Access LaBlood reservation page
        run: |
          echo "=== LaBlood connection test ==="

          curl -L --max-time 30 \
            -A "Mozilla/5.0" \
            -o labrad.html \
            "https://www.kenketsu.jp/ReservationHome"

          echo "=== HTTP/page check ==="

          if grep -q "献血の予約" labrad.html; then
            echo "SUCCESS: LaBlood reservation page was retrieved."
          else
            echo "ERROR: LaBlood reservation page could not be confirmed."
            exit 1
          fi

          echo "=== Page size ==="
          wc -c labrad.html
