name: LaBlood Hokkaido Page Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download LaBlood reservation page
        run: |
          echo "=== LaBlood reservation page test ==="

          curl -L --max-time 30 \
            -A "Mozilla/5.0" \
            -o labrad.html \
            "https://www.kenketsu.jp/ReservationHome"

          echo "=== Download completed ==="
          wc -c labrad.html

      - name: Search Hokkaido information
        run: |
          echo "=== Search results ==="

          grep -o "北海道" labrad.html | head -20 || true

          echo "=== ReservationHome links ==="

          grep -o 'href="[^"]*"' labrad.html | head -50 || true

          echo "=== Test completed ==="
